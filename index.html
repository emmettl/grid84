    <!--
      Two hosts serve this: grid84.app through a Cloudflare Worker and
      emmettl.github.io/grid84 through Pages. The canonical link points at the
      domain so the two copies do not compete with each other for the same
      words.
    -->
    <link rel="canonical" href="https://grid84.app/" />

    <meta
      name="description"
      content="An evidence-tiered engine for the history and doctrine of strategic nuclear weapons. Blast, fire and fallout computed over real population grids; Cold War war plans replayed from the declassified record; a strike console for any place on Earth; and the nuclear winter and famine that follow. Every figure carries its source and its tier."
    />
    <!--
      Keywords are ignored by every search engine that matters and have been for
      twenty years. They are here because they cost nothing and a few small
      engines still read them; the work of being found is done by the title, the
      description, the headings and the prerendered pages under /studies.
    -->
    <meta
      name="keywords"
      content="nuclear weapons effects, nuclear war simulation, blast radius calculator, fallout model, nuclear winter, Glasstone and Dolan, The Effects of Nuclear Weapons, SIOP, single integrated operational plan, counterforce, countervalue, deterrence, Cold War, Able Archer 83, Cuban missile crisis, V-force, Iskander, Minuteman, Trident, overpressure, thermal radiation, fission products, nuclear famine, Robock, Toon, Xia, declassified"
    />
    <meta name="author" content="Louis Emmett" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
