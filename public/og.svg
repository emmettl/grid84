<!--
  The social card: what a link to this site looks like when it is posted
  somewhere. Authored here as SVG because that is a thing a person can edit,
  and rasterised to og.png by scripts/build-og.sh, which needs macOS. The PNG
  is committed, because the card must not depend on the machine doing the
  build; nothing in CI makes it.

  The canvas is square and the card is the middle band of it. macOS pads a
  thumbnail out to a square whatever the source aspect, so the band is put
  where the crop will find it.

  The face is Menlo rather than the DM Mono the site itself sets, because the
  renderer has only the fonts the system has.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#050410"/>
  <g transform="translate(0,285)">
    <rect x="0" y="0" width="1200" height="630" fill="#050410"/>
    <g stroke="#8dfaff" stroke-opacity="0.06" stroke-width="1">
      <path d="M60 0V630M120 0V630M180 0V630M240 0V630M300 0V630M360 0V630M420 0V630M480 0V630M540 0V630M600 0V630M660 0V630M720 0V630M780 0V630M840 0V630M900 0V630M960 0V630M1020 0V630M1080 0V630M1140 0V630"/>
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200M0 420H1200M0 480H1200M0 540H1200"/>
    </g>
    <rect x="80" y="132" width="4" height="366" fill="#8dfaff"/>
    <text x="120" y="240" fill="#e8fbff" font-family="Menlo, monospace" font-size="104" letter-spacing="10">GRID/84</text>
    <text x="124" y="300" fill="#8dfaff" font-family="Menlo, monospace" font-size="26" letter-spacing="6">STRATEGIC NUCLEAR WEAPONS, MODELLED</text>
    <text x="124" y="368" fill="#e8fbff" fill-opacity="0.62" font-family="Menlo, monospace" font-size="25">Blast, fire and fallout over real population grids.</text>
    <text x="124" y="404" fill="#e8fbff" fill-opacity="0.62" font-family="Menlo, monospace" font-size="25">War plans from the declassified record.</text>
    <text x="124" y="440" fill="#e8fbff" fill-opacity="0.62" font-family="Menlo, monospace" font-size="25">The winter that follows.</text>
    <text x="124" y="492" fill="#7dff9a" font-family="Menlo, monospace" font-size="19" letter-spacing="4">DOCUMENTED · RECONSTRUCTED · INFERRED · MODELLED · WITHHELD</text>
  </g>
</svg>
